    <style>
        /* 九宫格容器 */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3列 */
            gap: 8px; /* 图片之间间距 */
            max-width: 600px;
            margin: 20px auto;
        }
        /* 图片样式 */
        .grid-box img {
            width: 100%;
            aspect-ratio: 1 / 1; /* 正方形 */

            border-radius: 6px;
